<div class="row g-2">
    <div class="contenido col-4" *ngFor="let producto of coleccionProducto">
        <div class="p-4 " style="width: 18rem;">
            <img style="width:200px;" src="{{producto.imagen}}" alt="{{producto.alt}}">
            <div class="card-body">
                <h5 class="card-title">{{producto.nombre}}</h5>
                <p class="card-text">
                    {{producto.descripcion}}
                    
                </p>
                <p class="card-text">
                    ${{producto.precio}}
                </p>
                <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="verMas"
                    (click)="  productoAgregado()">Añadir al Carrito</button>
            </div>
        </div>
    </div>
</div>
